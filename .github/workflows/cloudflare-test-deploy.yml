name: Verify deployed isolated Cloudflare test release

on:
  push:
    branches: [cloudflare-access-check]
    paths:
      - .github/workflows/cloudflare-test-deploy.yml
      - hosting/cloudflare-test/verify_public.py

permissions: {}

jobs:
  verify-public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public verification code
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/sma-controls"
          git -C "$RUNNER_TEMP/sma-controls" remote add origin https://github.com/sma-automation/sma-automation.github.io.git
          git -C "$RUNNER_TEMP/sma-controls" fetch --depth=1 origin "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/sma-controls" checkout --detach FETCH_HEAD
      - name: Verify public file hashes and headers without credentials
        run: python3 "$RUNNER_TEMP/sma-controls/hosting/cloudflare-test/verify_public.py"
