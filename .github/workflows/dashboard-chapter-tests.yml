name: Dashboard chapter navigation checks
on:
  push:
    branches: [dashboard-chapter-navigation, website-v1]
    paths: ['app/**', 'tests/**', '.github/workflows/dashboard-chapter-tests.yml']
  pull_request:
    branches: [website-v1]
    paths: ['app/**', 'tests/**', '.github/workflows/dashboard-chapter-tests.yml']
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch exact public source
        run: |
          git init .
          git remote add origin https://github.com/sma-automation/sma-automation.github.io.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install pinned DOM test dependencies
        run: npm ci --prefix tests/dom-runtime --ignore-scripts
      - name: Check chapters and existing dashboard flows
        run: |
          node --test tests/*.test.cjs
          node tests/run-optimizer-layout.mjs
          node tests/run-dashboard-chapters-dom.mjs
          node tests/run-publication-history-dom.mjs
          node tests/run-website-setup-dom.mjs
          node tests/run-new-website-domain-dom.mjs
          node tests/run-customer-website-dashboard-dom.mjs
