name: Refresh test-domain validation after confirmed external DNS update

on:
  push:
    branches: [cloudflare-access-check]
    paths:
      - .github/workflows/cloudflare-test-domain-refresh.yml

permissions: {}

jobs:
  refresh-test-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch public domain controller
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/sma-domain-refresh"
          git -C "$RUNNER_TEMP/sma-domain-refresh" remote add origin https://github.com/sma-automation/sma-automation.github.io.git
          git -C "$RUNNER_TEMP/sma-domain-refresh" fetch --depth=1 origin "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/sma-domain-refresh" checkout --detach FETCH_HEAD
      - name: Verify expected public CNAME before requesting validation
        run: |
          python3 - <<'PY'
          import json, urllib.request
          request = urllib.request.Request('https://dns.google/resolve?name=test.sma-automation.com&type=CNAME', headers={'User-Agent':'SMA-DNS-Verification/1.0'})
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.load(response)
          records = [r['data'].rstrip('.') for r in result.get('Answer', []) if r.get('type') == 5 and r.get('name', '').rstrip('.') == 'test.sma-automation.com']
          assert result.get('Status') == 0 and records == ['sma-customer-website-test.pages.dev'], 'EXPECTED_CNAME_NOT_FOUND'
          print('EXPECTED_CNAME_CONFIRMED')
          PY
      - name: Request one validation retry for this hostname only
        env:
          CLOUDFLARE_API_TOKEN_READONLY: ${{ secrets.CLOUDFLARE_API_TOKEN_READONLY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 "$RUNNER_TEMP/sma-domain-refresh/hosting/cloudflare-test/domain.py" retry
