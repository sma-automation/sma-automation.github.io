name: SMA Cloudflare access check (read only)

on:
  push:
    branches: [cloudflare-access-check]
    paths: [.github/workflows/cloudflare-access-check.yml]

permissions: {}

jobs:
  verify-access:
    if: github.repository == 'sma-automation/sma-automation.github.io' && github.ref == 'refs/heads/cloudflare-access-check'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # No checkout, third-party actions, deployment, or credential artifacts.
      - name: Verify token and Pages read access
        shell: python
        env:
          CLOUDFLARE_API_TOKEN_READONLY: ${{ secrets.CLOUDFLARE_API_TOKEN_READONLY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          def finish(code, ok=False, http_status=None, stage=None):
              result = {"check": "cloudflare_pages_read", "ok": ok, "code": code}
              if http_status is not None:
                  result["http_status"] = http_status
              if stage is not None:
                  result["stage"] = stage
              # Only fixed status labels and numeric HTTP status may reach logs.
              output = json.dumps(result, sort_keys=True)
              print(output)
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as handle:
                      handle.write("```json\n" + output + "\n```\n")
              sys.exit(0 if ok else 1)

          token = os.environ.get("CLOUDFLARE_API_TOKEN_READONLY", "").strip()
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          if not token:
              finish("TOKEN_SECRET_MISSING")
          # Accept an unambiguous copied Bearer header or code fence as text.
          # Never execute a supplied command, use its URL, or print its contents.
          fenced = re.fullmatch(r"```(?:[A-Za-z0-9_-]+)?[ \t]*\r?\n([\s\S]*?)\r?\n```", token)
          if fenced:
              token = fenced.group(1).strip()
          if len(token) >= 2 and token[0] == token[-1] and token[0] in "\"'":
              token = token[1:-1].strip()
          bearer_value = r"[A-Za-z0-9._~+/\-]+=*"
          header_values = re.findall(
              r"(?i)\bAuthorization[ \t]*:[ \t]*Bearer[ \t]+(" + bearer_value + r")(?=[\s\"'`\\]|$)",
              token,
          )
          if header_values:
              if len(set(header_values)) != 1:
                  finish("TOKEN_SECRET_AMBIGUOUS")
              token = header_values[0]
          else:
              bare = re.fullmatch(r"(?:Bearer[ \t]+)?(" + bearer_value + r")", token, re.IGNORECASE)
              if bare:
                  token = bare.group(1)
              elif not token.isascii():
                  finish("TOKEN_SECRET_UNRECOGNIZED_NON_ASCII_TEXT")
              elif "\n" in token or "\r" in token:
                  finish("TOKEN_SECRET_UNRECOGNIZED_MULTILINE_TEXT")
              else:
                  finish("TOKEN_SECRET_UNRECOGNIZED_TEXT")
          if not re.fullmatch(r"[0-9a-fA-F]{32}", account):
              finish("ACCOUNT_SECRET_MISSING_OR_INVALID")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          def get(path, stage):
              request = urllib.request.Request(
                  "https://api.cloudflare.com/client/v4" + path,
                  headers={"Authorization": "Bearer " + token, "Accept": "application/json"},
                  method="GET",
              )
              try:
                  with opener.open(request, timeout=20) as response:
                      body = response.read(1048577)
              except urllib.error.HTTPError as error:
                  finish("CLOUDFLARE_HTTP_ERROR", http_status=int(error.code), stage=stage)
              except (urllib.error.URLError, OSError):
                  finish("CLOUDFLARE_CONNECTION_ERROR", stage=stage)
              except (ValueError, UnicodeError):
                  finish("REQUEST_FORMAT_INVALID", stage=stage)
              if len(body) > 1048576:
                  finish("RESPONSE_TOO_LARGE", stage=stage)
              try:
                  data = json.loads(body)
              except (ValueError, UnicodeError):
                  finish("CLOUDFLARE_NON_JSON_RESPONSE", stage=stage)
              if not isinstance(data, dict) or data.get("success") is not True:
                  finish("CLOUDFLARE_REQUEST_REJECTED", stage=stage)
              return data.get("result")

          verification = get("/user/tokens/verify", "token_verify")
          if not isinstance(verification, dict) or verification.get("status") != "active":
              finish("TOKEN_NOT_ACTIVE")
          projects = get("/accounts/" + account + "/pages/projects?per_page=1", "pages_read")
          if not isinstance(projects, list):
              finish("PAGES_INVALID_RESPONSE")
          finish("CLOUDFLARE_ACCESS_OK", ok=True)
