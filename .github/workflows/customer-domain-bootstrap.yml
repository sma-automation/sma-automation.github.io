name: Install verified website providers
on:
  push:
    branches: [customer-domain-automation]
    paths: [.github/workflows/customer-domain-bootstrap.yml]
permissions:
  id-token: write
concurrency:
  group: customer-domain-bootstrap
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Transfer verified provider credentials directly to the private worker
        env:
          IONOS_KEY: ${{ secrets.IONOS_DNS_API_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_READONLY }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint='https://bnvnmdxosbnuzedokqgh.supabase.co/functions/v1/sma-website-setup';
          try {
            const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set('audience',endpoint);
            const identity=await fetch(url,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},redirect:'error',signal:AbortSignal.timeout(15000)});
            if(!identity.ok)throw Error();
            const {value}=await identity.json();
            const response=await fetch(endpoint,{method:'POST',headers:{Authorization:'Bearer '+value,'Content-Type':'application/json'},redirect:'error',signal:AbortSignal.timeout(60000),body:JSON.stringify({action:'bootstrap',ionos_key:process.env.IONOS_KEY,prefix:'3a7441c7fe44415ea2e39ce4265311d4',cloudflare_token:process.env.CF_TOKEN,account_id:process.env.CF_ACCOUNT.trim()})});
            const result=await response.json();
            if(!response.ok||result.code!=='PROVIDERS_INSTALLED')throw Error();
            console.log('Verified providers installed. No credentials printed or written to artifacts.');
          } catch { console.log('Provider installation was not confirmed.');process.exitCode=1; }
          NODE
