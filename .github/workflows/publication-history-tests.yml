name: Publication history checks
on:
  push:
    branches: [publication-history-v1, publication-history-months, publication-text-history, publication-assignment-history, compact-history-orders, compact-history-spacing, website-v1]
    paths:
      - app/assets/media-music*
      - app/assets/publication-export-cover*
      - tests/*media-music*
      - app/assets/media-export*
      - n8n/publishing/*editor-source*
      - supabase/sql/publication-editor-exports.sql
      - tests/*media-export*
      - app/assets/media-metadata*
      - tests/media-metadata*
      - app/assets/media-editor*
      - app/media-editor.html
      - app/assets/publication-editor-history*
      - supabase/sql/publication-editor-history.sql
      - supabase/migrations/*_publication_editor_history_v1.sql
      - tests/*media-editor*
      - tests/*publication-editor-history*
      - app/assets/publication-history*
      - app/assets/publication-text-history*
      - app/assets/publication-assignment-history*
      - supabase/sql/publication-assignment-history.sql
      - supabase/migrations/*_publication_assignment_history_v1.sql
      - tests/*publication-assignment-history*
      - app/dashboard.html
      - supabase/sql/publication-text-history.sql
      - supabase/migrations/*_publication_text_history_v1.sql
      - tests/*publication-text-history*
      - supabase/sql/publication-history.sql
      - supabase/sql/publication-history-months.sql
      - supabase/migrations/*_publication_history_v1.sql
      - supabase/migrations/*_publication_history_months_v1.sql
      - tests/*publication-history*
      - tests/sql-runtime/publication-history-fixture.sql
      - .github/workflows/publication-history-tests.yml
  pull_request:
    branches: [website-v1]
    paths: ['app/**', 'supabase/**', 'tests/**', '.github/workflows/publication-history-tests.yml']
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch exact public source
        run: |
          git init .
          git remote add origin https://github.com/sma-automation/sma-automation.github.io.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install pinned test dependencies
        run: |
          npm ci --prefix tests/sql-runtime --ignore-scripts
          npm ci --prefix tests/dom-runtime --ignore-scripts
      - name: Test histories, editor drafts and regressions
        run: |
          node --test tests/*.test.cjs
          node tests/run-publication-history-sql.mjs
          node tests/run-publication-history-months-sql.mjs
          node tests/run-publication-history-dom.mjs
          node tests/run-publication-text-history-sql.mjs
          node tests/run-publication-assignment-history-sql.mjs
          node tests/run-publication-editor-history-sql.mjs
          node tests/run-media-editor-dom.mjs
          node tests/run-media-export-sql.mjs
          node tests/run-media-export-dom.mjs
          node tests/run-media-music-dom.mjs
