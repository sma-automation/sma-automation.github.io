  pull_request:
    branches: [website-v1]
    paths: ['app/**', 'supabase/**', 'tests/**', '.github/workflows/publication-history-tests.yml']
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch exact public source
        run: |
          git init .
          git remote add origin https://github.com/sma-automation/sma-automation.github.io.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install pinned test dependencies
        run: |
          npm ci --prefix tests/sql-runtime --ignore-scripts
          npm ci --prefix tests/dom-runtime --ignore-scripts
          npm ci --prefix tests/media-runtime --ignore-scripts
          npm ci --prefix n8n/private-gallery-runtime --ignore-scripts
      - name: Ensure FFmpeg and FFprobe for the saved-video sound check
        run: |
          # Hosted runners may not include either binary, and Ubuntu apt
          # mirrors can be unreachable. Use pinned, npm-hosted test binaries
          # instead of an unbounded apt retry; never skip media decoding.
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            tools_dir="$RUNNER_TEMP/sma-ci-media-tools"
            bin_dir="$RUNNER_TEMP/sma-ci-media-bin"
            mkdir -p "$tools_dir" "$bin_dir"
            npm install --prefix "$tools_dir" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund \
              @ffmpeg-installer/ffmpeg@1.1.0 @ffprobe-installer/ffprobe@2.1.2
            ffmpeg_path="$(node -p "require('$tools_dir/node_modules/@ffmpeg-installer/ffmpeg').path")"
            ffprobe_path="$(node -p "require('$tools_dir/node_modules/@ffprobe-installer/ffprobe').path")"
            # npm's ignore-scripts can skip binary executable-bit setup.
            # The packages are pinned and downloaded only for CI fixtures.
            chmod u+x "$ffmpeg_path" "$ffprobe_path"
            test -x "$ffmpeg_path" && test -x "$ffprobe_path"
            ln -s "$ffmpeg_path" "$bin_dir/ffmpeg"
            ln -s "$ffprobe_path" "$bin_dir/ffprobe"
            echo "$bin_dir" >> "$GITHUB_PATH"
            export PATH="$bin_dir:$PATH"
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Test histories, editor drafts and regressions
        env:
          SMA_REQUIRE_FFMPEG: '1'
        run: |
          node --test tests/*.test.cjs
          node tests/run-launch-readiness-sql.mjs
          node tests/run-publication-comparison-sql.mjs
          node tests/run-publication-video-sql.mjs
          node tests/run-publication-file-metadata-sql.mjs
          node tests/run-publication-assignment-freshness-sql.mjs
          node tests/run-publication-gallery-technical-sql.mjs
          node tests/run-gallery-worker-snapshot-sql.mjs
          node tests/run-publication-delivery-sql.mjs
          node tests/run-publication-manual-review-sql.mjs
          node tests/run-publication-manual-review-dom.mjs
          node tests/run-original-video-preview-dom.mjs
          node tests/run-publication-text-edits-sql.mjs
          node tests/run-publication-shop-invitation-sql.mjs
          node tests/run-publication-draft-product-links-sql.mjs
          node tests/run-publication-text-edits-dom.mjs
          node tests/run-publication-history-sql.mjs
          node tests/run-publication-history-find-sql.mjs
          node tests/run-publication-history-months-sql.mjs
          node tests/run-publication-history-dom.mjs
          node tests/run-dashboard-cloud-upload-dom.mjs
          node tests/run-publication-text-history-sql.mjs
          node tests/run-publication-text-history-hashtags-sql.mjs
          node tests/run-publication-assignment-history-sql.mjs
          node tests/run-publication-editor-history-sql.mjs
          node tests/run-publication-analysis-history-sql.mjs
          node tests/run-media-editor-dom.mjs
          node tests/run-media-export-sql.mjs
          node tests/run-export-probe-sql.mjs
          node tests/run-media-export-dom.mjs
          node tests/run-media-music-dom.mjs
          node tests/run-export-music-cancel-dom.mjs
          node tests/run-gallery-music-sql.mjs
          node tests/run-gallery-music-wasm.mjs
          node tests/run-gallery-music-receipt.mjs
          node tests/run-gallery-background-sql.mjs
          node tests/run-music-credits-sql.mjs
          node tests/run-music-library-sql.mjs
          node tests/run-music-library-reservations-sql.mjs
          node tests/run-music-library-dom.mjs
          node tests/run-provider-cover-sql.mjs
          node tests/run-publication-cover-history-sql.mjs
  music-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sma_music_reservation_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 6
    steps:
      - name: Fetch exact public source
        run: |
          git init .
          git remote add origin https://github.com/sma-automation/sma-automation.github.io.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install pinned PostgreSQL test client
        run: npm ci --prefix tests/postgres-runtime --ignore-scripts
      - name: Test concurrent upload and reservation cleanup
        run: node tests/run-music-library-concurrency.mjs
