name: Publication history checks
on:
  push:
    branches: [publication-history-v1, publication-history-months, publication-text-history, publication-assignment-history, compact-history-orders, compact-history-spacing, website-v1]
    paths:
      - app/assets/publication-analysis-history*
      - tests/*publication-analysis-history*
      - supabase/sql/publication-analysis-history.sql
      - supabase/migrations/*_publication_analysis_history_v1.sql
      - app/assets/publication-hashtags.mjs
      - app/assets/publication-preview.js
      - app/publication-preview.html
      - tests/*publication-text-edits*
      - tests/publication-hashtags.test.cjs
      - supabase/sql/publication-text-edits.sql
      - supabase/migrations/*_publication_text_edits_v1.sql
      - app/assets/publication-cover-history*
      - tests/*publication-cover-history*
      - supabase/sql/publication-cover-history.sql
      - supabase/migrations/*_publication_cover_history_v1.sql
      - n8n/publishing/*provider-cover*
      - tests/*provider-cover*
      - tests/sql-runtime/provider-cover-pr57-journal.sql
      - supabase/sql/publication-provider-cover.sql
      - supabase/migrations/*_publication_provider_cover_v1.sql
      - app/assets/music-library*
      - tests/*music-library*
      - tests/sql-runtime/music-library-fixture.sql
      - tests/postgres-runtime/**
      - supabase/sql/music-library-reservations.sql
      - supabase/migrations/*_music_empty_reservations_v1.sql
      - supabase/sql/music-library.sql
      - supabase/migrations/*_music_library_v1.sql
      - app/assets/media-music*
      - app/assets/publication-export-cover*
      - tests/*media-music*
      - tests/run-export-music-cancel-dom.mjs
      - app/assets/media-export*
      - n8n/publishing/*editor-source*
      - supabase/sql/publication-editor-exports.sql
      - tests/*media-export*
      - app/assets/media-metadata*
      - tests/media-metadata*
      - app/assets/media-editor*
      - app/media-editor.html
      - app/assets/publication-editor-history*
      - supabase/sql/publication-editor-history.sql
      - supabase/migrations/*_publication_editor_history_v1.sql
      - tests/*media-editor*
      - tests/*publication-editor-history*
      - app/assets/publication-history*
      - app/assets/publication-text-history*
      - app/assets/publication-assignment-history*
      - supabase/sql/publication-assignment-history.sql
      - supabase/migrations/*_publication_assignment_history_v1.sql
      - tests/*publication-assignment-history*
      - app/dashboard.html
      - supabase/sql/publication-text-history.sql
      - supabase/sql/publication-text-history-hashtags.sql
      - supabase/migrations/*_publication_text_history_hashtags_v1.sql
      - supabase/migrations/*_publication_text_history_v1.sql
      - tests/*publication-text-history*
      - supabase/sql/publication-history.sql
      - supabase/sql/publication-history-months.sql
      - supabase/migrations/*_publication_history_v1.sql
      - supabase/migrations/*_publication_history_months_v1.sql
      - tests/*publication-history*
      - tests/sql-runtime/publication-history-fixture.sql
      - .github/workflows/publication-history-tests.yml
  pull_request:
    branches: [website-v1]
    paths: ['app/**', 'supabase/**', 'tests/**', '.github/workflows/publication-history-tests.yml']
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch exact public source
        run: |
          git init .
          git remote add origin https://github.com/sma-automation/sma-automation.github.io.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install pinned test dependencies
        run: |
          npm ci --prefix tests/sql-runtime --ignore-scripts
          npm ci --prefix tests/dom-runtime --ignore-scripts
      - name: Test histories, editor drafts and regressions
        run: |
          node --test tests/*.test.cjs
          node tests/run-publication-text-edits-sql.mjs
          node tests/run-publication-text-edits-dom.mjs
          node tests/run-publication-history-sql.mjs
          node tests/run-publication-history-months-sql.mjs
          node tests/run-publication-history-dom.mjs
          node tests/run-publication-text-history-sql.mjs
          node tests/run-publication-text-history-hashtags-sql.mjs
          node tests/run-publication-assignment-history-sql.mjs
          node tests/run-publication-editor-history-sql.mjs
          node tests/run-publication-analysis-history-sql.mjs
          node tests/run-media-editor-dom.mjs
          node tests/run-media-export-sql.mjs
          node tests/run-media-export-dom.mjs
          node tests/run-media-music-dom.mjs
          node tests/run-export-music-cancel-dom.mjs
          node tests/run-music-library-sql.mjs
          node tests/run-music-library-reservations-sql.mjs
          node tests/run-music-library-dom.mjs
          node tests/run-provider-cover-sql.mjs
          node tests/run-publication-cover-history-sql.mjs
  music-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sma_music_reservation_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 6
    steps:
      - name: Fetch exact public source
        run: |
          git init .
          git remote add origin https://github.com/sma-automation/sma-automation.github.io.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install pinned PostgreSQL test client
        run: npm ci --prefix tests/postgres-runtime --ignore-scripts
      - name: Test concurrent upload and reservation cleanup
        run: node tests/run-music-library-concurrency.mjs
