      - supabase/sql/publication-history.sql
      - supabase/sql/publication-history-months.sql
      - supabase/migrations/*_publication_history_v1.sql
      - supabase/migrations/*_publication_history_months_v1.sql
      - tests/*publication-history*
      - tests/sql-runtime/publication-history-fixture.sql
      - .github/workflows/publication-history-tests.yml
  pull_request:
    branches: [website-v1]
    paths: ['app/**', 'supabase/**', 'tests/**', '.github/workflows/publication-history-tests.yml']
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch exact public source
        run: |
          git init .
          git remote add origin https://github.com/sma-automation/sma-automation.github.io.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install pinned test dependencies
        run: |
          npm ci --prefix tests/sql-runtime --ignore-scripts
          npm ci --prefix tests/dom-runtime --ignore-scripts
          npm ci --prefix tests/media-runtime --ignore-scripts
      - name: Test histories, editor drafts and regressions
        run: |
          node --test tests/*.test.cjs
          node tests/run-publication-manual-review-sql.mjs
          node tests/run-publication-manual-review-dom.mjs
          node tests/run-original-video-preview-dom.mjs
          node tests/run-publication-text-edits-sql.mjs
          node tests/run-publication-draft-product-links-sql.mjs
          node tests/run-publication-text-edits-dom.mjs
          node tests/run-publication-history-sql.mjs
          node tests/run-publication-history-months-sql.mjs
          node tests/run-publication-history-dom.mjs
          node tests/run-publication-text-history-sql.mjs
          node tests/run-publication-text-history-hashtags-sql.mjs
          node tests/run-publication-assignment-history-sql.mjs
          node tests/run-publication-editor-history-sql.mjs
          node tests/run-publication-analysis-history-sql.mjs
          node tests/run-media-editor-dom.mjs
          node tests/run-media-export-sql.mjs
          node tests/run-export-probe-sql.mjs
          node tests/run-media-export-dom.mjs
          node tests/run-media-music-dom.mjs
          node tests/run-export-music-cancel-dom.mjs
          node tests/run-gallery-music-sql.mjs
          node tests/run-gallery-music-wasm.mjs
          node tests/run-gallery-music-receipt.mjs
          node tests/run-gallery-background-sql.mjs
          node tests/run-music-credits-sql.mjs
          node tests/run-music-library-sql.mjs
          node tests/run-music-library-reservations-sql.mjs
          node tests/run-music-library-dom.mjs
          node tests/run-provider-cover-sql.mjs
          node tests/run-publication-cover-history-sql.mjs
  music-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sma_music_reservation_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 6
    steps:
      - name: Fetch exact public source
        run: |
          git init .
          git remote add origin https://github.com/sma-automation/sma-automation.github.io.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install pinned PostgreSQL test client
        run: npm ci --prefix tests/postgres-runtime --ignore-scripts
      - name: Test concurrent upload and reservation cleanup
        run: node tests/run-music-library-concurrency.mjs
