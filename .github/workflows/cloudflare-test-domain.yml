name: Bind agreed test hostname to isolated Cloudflare project

on:
  push:
    branches: [cloudflare-access-check]
    paths:
      - .github/workflows/cloudflare-test-domain.yml
      - hosting/cloudflare-test/domain.py

permissions: {}

concurrency:
  group: sma-cloudflare-test-domain
  cancel-in-progress: false

jobs:
  bind-test-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch exact public control script
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/sma-domain-controls"
          git -C "$RUNNER_TEMP/sma-domain-controls" remote add origin https://github.com/sma-automation/sma-automation.github.io.git
          git -C "$RUNNER_TEMP/sma-domain-controls" fetch --depth=1 origin "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/sma-domain-controls" checkout --detach FETCH_HEAD
      - name: Attach only test.sma-automation.com, without DNS changes
        env:
          CLOUDFLARE_API_TOKEN_READONLY: ${{ secrets.CLOUDFLARE_API_TOKEN_READONLY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 "$RUNNER_TEMP/sma-domain-controls/hosting/cloudflare-test/domain.py" attach
