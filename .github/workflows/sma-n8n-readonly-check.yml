name: SMA n8n read-only connection check

# Operator-started only: never runs on push, PR, cron or schedule.
on:
  workflow_dispatch:
    inputs:
      check:
        description: Read the published payment graph, saved execution metadata, or both
        type: choice
        required: true
        default: both
        options:
          - both
          - payment
          - executions

# Do not issue a GitHub repository token to this job.
permissions: {}
concurrency:
  group: sma-n8n-readonly-audit
  cancel-in-progress: false

jobs:
  readonly:
    if: github.repository == 'sma-automation/sma-automation.github.io' && github.actor == 'sma-automation'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SMA_N8N_READ_API_KEY: ${{ secrets.SMA_N8N_READ_API_KEY }}
      SMA_CHECK: ${{ inputs.check }}
    steps:
      - name: Check out the reviewed SMA audit code (no repository credentials)
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin https://github.com/sma-automation/sma-automation.github.io.git
          git -c protocol.version=2 fetch --quiet --no-tags --depth=1 origin d973dc7e3ad638a84d870415b136f20360cfca8a
          git -c advice.detachedHead=false checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 'd973dc7e3ad638a84d870415b136f20360cfca8a'

      - name: Inspect only the n8n Public API GET endpoints
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SMA_N8N_READ_API_KEY:-}" ]; then
            echo 'N8N_READ_API_KEY_REQUIRED: set the encrypted GitHub Actions repository secret; never paste it in a chat or log.'
            exit 1
          fi
          node <<'NODE'
          'use strict';
          const onlyCodes = issues => Array.isArray(issues) ?
            issues.filter(i => typeof i === 'string' && /^[A-Za-z0-9_]{1,70}$/.test(i)).slice(0,8) : [];
          async function main(){
            const check=process.env.SMA_CHECK;
            if(!['both','payment','executions'].includes(check)) throw Error('INVALID_CHECK');
            let allOk=true;
            if(check==='both'||check==='payment'){
              const {inspectLivePaymentWorker}=require('./n8n/package-payment/audit-live-worker.cjs');
              const result=await inspectLivePaymentWorker({timeoutMs:12000});
              const status=result?.ok===true ? 'STRUCTURE_MATCHES_NOT_E2E' : 'REVIEW_REQUIRED';
              console.log('SMA_N8N_PAYMENT_GRAPH='+status);
              if(result?.ok===true){
                const kind=result?.status==='PUBLISHED_PAYMENT_EXACT_SOURCE_EQUIVALENCE_NOT_E2E'
                  ? 'RENAMED_SOURCE_EQUIVALENT_NOT_E2E' : 'NAMED_SOURCE_MATCH_NOT_E2E';
                console.log('SMA_N8N_PAYMENT_CONTRACT='+kind);
              }
              if(!result?.ok){
                allOk=false;
                console.log('SMA_N8N_PAYMENT_CHECK_CODES='+onlyCodes(result?.issues).join(','));
                // Only derived, bounded counters and fixed booleans. Never print
                // the active workflow graph, node parameters, credentials,
                // arbitrary live node names or customer references.
                const d=result?.diagnostic;
                if(d?.status==='STRUCTURE_DIAGNOSTIC_NOT_E2E'){
                  const count=x=>Number.isSafeInteger(x)&&x>=0&&x<=5000?x:0;
                  const flag=x=>x===true?'YES':'NO';
                  console.log('SMA_N8N_PUBLISHED_NODE_COUNT='+count(d.published_nodes_count));
                  console.log('SMA_N8N_EXPECTED_PAYMENT_NODES_PRESENT='+
                    count(d.expected_payment_nodes_present)+'/'+count(d.expected_payment_nodes_count));
                  console.log('SMA_N8N_FIRST_PAYMENT_WEBHOOK_PRESENT='+flag(d.first_payment_webhook_present));
                  console.log('SMA_N8N_RENEWAL_WEBHOOK_PRESENT='+flag(d.renewal_payment_webhook_present));
                  console.log('SMA_N8N_ACTIVATION_FOLDER_GUARD_PRESENT='+flag(d.activation_folder_guard_present));
                  console.log('SMA_N8N_ACTIVATION_CUSTOMER_WRITE_PRESENT='+flag(d.activation_customer_update_present));
                  console.log('SMA_N8N_MOLLIE_CREDENTIAL_NODE_COUNTS='+
                    count(d.merchant_nodes_with_credential_reference)+'/'+count(d.existing_merchant_nodes));
                  console.log('SMA_N8N_DATABASE_CREDENTIAL_NODE_COUNTS='+
                    count(d.database_nodes_with_credential_reference)+'/'+count(d.existing_database_nodes));
                  console.log('SMA_N8N_CUSTOMER_TABLE_REFERENCE_NODE_COUNTS='+
                    count(d.customer_table_nodes_with_reference)+'/'+count(d.existing_customer_table_nodes));
                  // The new audit re-reads activeVersionId even on mismatch.
                  // This flag is metadata stability only, not execution safety.
                  const t=result?.path_trace;
                  console.log('SMA_N8N_PUBLISHED_VERSION_STABLE_RECHECK='+
                    (result.published_version_stability_rechecked===true?'YES':'NO'));
                  if(t?.status==='PUBLISHED_PAYMENT_MAIN_GRAPH_TRACE_NOT_E2E' &&
                    t.active_version_stability_verified===true){
                    const bounded=x=>Number.isSafeInteger(x)&&x>=0&&x<=50000?x:0;
                    console.log('SMA_N8N_PAYMENT_STATIC_TRACE=READ_ONLY_NOT_E2E');
                    console.log('SMA_N8N_MAIN_EDGE_COUNT='+bounded(t.graph_main_edges));
                    console.log('SMA_N8N_UNKNOWN_MAIN_TARGET_COUNT='+bounded(t.unknown_edge_targets));
                    for(const [prefix,key] of [
                      ['FIRST_PAYMENT','first_payment'],
                      ['RENEWAL_PAYMENT','renewal']
                    ]){
                      const p=t[key];
                      if(!p)continue;
                      console.log('SMA_N8N_'+prefix+'_ENTRY_UNIQUE='+(p.entry_count===1?'YES':'NO'));
                      console.log('SMA_N8N_'+prefix+'_ENTRY_CONFIG_MATCHES='+
                        (p.response_mode_matches===true?'YES':'NO'));
                      console.log('SMA_N8N_'+prefix+'_OUTGOING_EDGES='+bounded(p.outgoing_edges));
                      console.log('SMA_N8N_'+prefix+'_REACHABLE_NODES='+bounded(p.reachable_nodes));
                      console.log('SMA_N8N_'+prefix+'_REACHABLE_RESPONSES='+
                        bounded(p.reachable_respond_to_webhook));
                      // These are explicit MAIN-graph terminal counts, not
                      // runtime success or complete conditional coverage.
                      console.log('SMA_N8N_'+prefix+'_RESPONSE_TERMINAL_NODES='+
                        bounded(p.static_response_terminal_nodes));
                      console.log('SMA_N8N_'+prefix+'_NONRESPONSE_TERMINAL_NODES='+
                        bounded(p.static_nonresponse_terminal_nodes));
                      console.log('SMA_N8N_'+prefix+'_EMPTY_DECISION_OUTPUT_PORTS='+
                        bounded(p.explicit_empty_decision_output_ports));
                      console.log('SMA_N8N_'+prefix+'_MISSING_IF_OUTPUT_PORTS='+
                        bounded(p.missing_if_output_ports));
                      console.log('SMA_N8N_'+prefix+'_REACHABLE_CODE='+bounded(p.reachable_code_nodes));
                      console.log('SMA_N8N_'+prefix+'_REACHABLE_HTTP='+bounded(p.reachable_http_requests));
                      console.log('SMA_N8N_'+prefix+'_REACHABLE_DATA_TABLE='+
                        bounded(p.reachable_data_table_nodes));
                      console.log('SMA_N8N_'+prefix+'_REACHABLE_SUBWORKFLOW='+
                        bounded(p.reachable_subworkflow_calls));
                      console.log('SMA_N8N_'+prefix+'_NAMED_FOLDER_GUARD_REACHABLE='+
                        (p.named_folder_guard_reachable===true?'YES':'NO'));
                      // Static marker presence only: a URL, Data Table filter,
                      // credential reference or code token is not a guard proof.
                      const c=p.config_markers;
                      if(c?.status==='CONFIG_MARKERS_PRESENT_NOT_VALIDATED'){
                        const fields=[
                          ['LITERAL_MOLLIE_API','http_literal_mollie_v2'],
                          ['LITERAL_SMA_RPC','http_literal_sma_supabase_rpc'],
                          ['DYNAMIC_HTTP_TARGET','http_dynamic_or_missing_target'],
                          ['OTHER_LITERAL_HTTP_TARGET','http_other_literal_target'],
                          ['HTTP_WRITE_METHODS','http_configured_mutating_method'],
                          ['HEADER_AUTH_REFERENCES','http_with_header_auth_reference'],
                          ['IDEMPOTENCY_HEADER_MARKERS','http_with_idempotency_key_header'],
                          ['DATA_TABLE_WRITES','data_table_write_operations'],
                          ['DATA_TABLE_IDENTITY_FILTER_MARKERS','data_table_writes_with_identity_filter_markers'],
                          ['DATA_TABLE_BOTH_FOLDER_FILTER_MARKERS','data_table_writes_with_both_folder_filter_markers'],
                          ['CODE_TICKET_TEXT_MARKERS','code_nodes_with_ticket_marker'],
                          ['CODE_BOTH_FOLDER_TEXT_MARKERS','code_nodes_with_both_folder_markers'],
                          ['CODE_PAYMENT_RECEIPT_TEXT_MARKERS','code_nodes_with_payment_receipt_markers'],
                          ['CODE_NODES_SKIPPED_OVERSIZE','code_nodes_skipped_oversize']
                        ];
                        for(const [label,key] of fields)
                          console.log('SMA_N8N_'+prefix+'_'+label+'='+bounded(c[key]));
                        console.log('SMA_N8N_'+prefix+'_EFFECTIVE_PAYMENT_GUARDS=NOT_VERIFIED');
                      }
                    }
                    console.log('SMA_N8N_PAYMENT_SAFE_E2E=NOT_VERIFIED');
                  }
                }
              }
            }
            if(check==='both'||check==='executions'){
              const {inspectSavedExecutionMetadata}=require('./n8n/consolidation/read-execution-metadata.cjs');
              const result=await inspectSavedExecutionMetadata({maxPages:10,timeoutMs:15000});
              const status=result?.ok===true ?
                (result.more_saved_pages_available===true ? 'PARTIAL_SAVED_HISTORY_NOT_BILLING' : 'SAVED_HISTORY_NOT_BILLING') :
                'UNAVAILABLE';
              console.log('SMA_N8N_EXECUTION_METADATA='+status);
              if(result?.ok===true){
                const count=x=>Number.isSafeInteger(x)&&x>=0?x:0;
                console.log('SMA_N8N_SAVED_EXECUTIONS_IN_WINDOW='+count(result.records_in_window));
                console.log('SMA_N8N_SAVED_WEBHOOK_TRIGGER_CANDIDATES='+count(result.production_mode_candidates));
                console.log('SMA_N8N_SAVED_HISTORY_PAGINATION_PARTIAL='+
                  (result.more_saved_pages_available===true?'YES':'NO'));
              }
              if(!result?.ok){
                allOk=false;
                const code=result?.issue;
                console.log('SMA_N8N_EXECUTION_CHECK_CODE='+
                  (typeof code==='string' && /^[A-Z0-9_]{1,70}$/.test(code) ? code:'UNAVAILABLE'));
              }
            }
            console.log('SMA_N8N_REAL_CUSTOMER_E2E=NOT_VERIFIED');
            console.log('SMA_N8N_BILLING_METER=NOT_VERIFIED');
            if(!allOk) process.exitCode=1;
          }
          main().catch(()=>{console.log('SMA_N8N_READONLY_AUDIT=FAILED');process.exitCode=1;});
          NODE
