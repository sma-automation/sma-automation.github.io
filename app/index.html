<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMA Kundenbereich</title>

<style>
:root {
  --bg: #05070b;
  --surface: #101726;
  --line: #253452;
  --text: #f5f7fb;
  --muted: #9aa8bf;
  --blue: #4f7cff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at top right, rgba(79,124,255,.22), transparent 30%),
    var(--bg);
  color: var(--text);
}

header {
  height: 72px;
  border-bottom: 1px solid #1c2940;
  display: flex;
  align-items: center;
}

.header-inner {
  width: min(1100px, calc(100% - 32px));
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 22px;
  font-weight: 900;
}

.back {
  color: #9eb7ff;
  text-decoration: none;
}

main {
  min-height: calc(100vh - 72px);
  display: grid;
  place-items: center;
  padding: 30px 16px;
}

.login-card {
  width: min(440px, 100%);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 32px;
}

h1 {
  margin: 0 0 10px;
  font-size: 34px;
}

.intro {
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 28px;
}

label {
  display: block;
  margin: 16px 0 7px;
  font-size: 13px;
  font-weight: 700;
}

input {
  width: 100%;
  height: 46px;
  border-radius: 10px;
  border: 1px solid #31415f;
  background: #09101c;
  color: white;
  padding: 0 13px;
  font-size: 15px;
}

button {
  width: 100%;
  height: 46px;
  margin-top: 22px;
  border: 0;
  border-radius: 10px;
  background: var(--blue);
  color: white;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
}

.register {
  text-align: center;
  margin-top: 20px;
  color: var(--muted);
  font-size: 14px;
}

.register a {
  color: #9eb7ff;
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">SMA</div>
    <a class="back" href="../index.html">Zur Startseite</a>
  </div>
</header>

<main>

  <div class="login-card">

    <h1>Kundenbereich</h1>

    <div class="intro">
      Melde dich an, um dein SMA Dashboard zu öffnen.
    </div>

    <form>

      <label for="email">E-Mail-Adresse</label>
      <input
        id="email"
        type="email"
        placeholder="name@beispiel.at"
      >

      <label for="password">Passwort</label>
      <input
        id="password"
        type="password"
        placeholder="••••••••"
      >

      <button type="button">
        Anmelden
      </button>

    </form>

    <div class="register">
      Noch kein SMA-Konto?
      <a href="#">Registrieren</a>
    </div>

  </div>

</main>

</body>
</html>
