
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMA Kundenbereich</title>

<style>
:root {
  --bg: #05070b;
  --surface: #101726;
  --line: #253452;
  --text: #f5f7fb;
  --muted: #9aa8bf;
  --blue: #4f7cff;
  --blue-dark: #315fd1;
  --green: #39c278;
  --red: #ef6b73;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(
      circle at top right,
      rgba(79,124,255,.22),
      transparent 30%
    ),
    var(--bg);
  color: var(--text);
}

header {
  height: 72px;
  border-bottom: 1px solid #1c2940;
  display: flex;
  align-items: center;
}

.header-inner {
  width: min(1100px, calc(100% - 32px));
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.logo {
  font-size: clamp(16px, 4vw, 22px);
  font-weight: 900;
  letter-spacing: .4px;
}

.back {
  white-space: nowrap;
  color: #9eb7ff;
  text-decoration: none;
}

main {
  min-height: calc(100vh - 72px);
  display: grid;
  place-items: center;
  padding: 30px 16px;
}

.login-card {
  width: min(460px, 100%);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 32px;
  box-shadow: 0 24px 70px rgba(0,0,0,.28);
}

h1 {
  margin: 0 0 10px;
  font-size: 34px;
}

.login-brand {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-bottom: 24px;
  font-size: 20px;
  font-weight: 900;
  line-height: 1;
}

.login-brand .hex {
  display: grid;
  place-items: center;
  width: 52px;
  height: 46px;
  background: #fff;
  color: #3768ed;
  font-size: 22px;
  clip-path: polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
}

.login-brand .logoeq {
  opacity: .65;
}

.intro {
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 26px;
}

label {
  display: block;
  margin: 16px 0 7px;
  font-size: 13px;
  font-weight: 700;
}

input {
  width: 100%;
  height: 46px;
  border-radius: 10px;
  border: 1px solid #31415f;
  background: #09101c;
  color: white;
  padding: 0 13px;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: var(--blue);
}

/* Passwortfeld mit Augensymbol */

.password-field {
  position: relative;
}

.password-field input {
  padding-right: 52px;
}

.eye-toggle {
  position: absolute;
  top: 50%;
  right: 4px;
  transform: translateY(-50%);
  width: 42px;
  min-height: 38px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}

.eye-toggle:hover,
.eye-toggle:focus-visible {
  background: #1d2a41;
  color: white;
}

.eye-toggle svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.eye-toggle .slash {
  display: none;
}

.eye-toggle.is-visible .slash {
  display: block;
}

.actions {
  display: grid;
  gap: 10px;
  margin-top: 22px;
}

button {
  width: 100%;
  min-height: 46px;
  border: 0;
  border-radius: 10px;
  background: var(--blue);
  color: white;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
}

button:hover {
  background: var(--blue-dark);
}

button.secondary,
.auth-mode-link {
  background: transparent;
  border: 1px solid #31415f;
  color: #dbe5ff;
}

button.secondary:hover,
.auth-mode-link:hover {
  background: #1d2a41;
}

.auth-mode-link {
  display: grid;
  place-items: center;
  min-height: 46px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 800;
  text-decoration: none;
}

button:disabled {
  opacity: .65;
  cursor: default;
}

button.link-button {
  width: auto;
  min-height: 34px;
  padding: 2px 0;
  background: transparent;
  color: #9eb7ff;
  font-size: 13px;
  font-weight: 700;
}

button.link-button:hover {
  color: white;
  text-decoration: underline;
}

.link-row {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 4px 14px;
  margin-top: 8px;
}

.status {
  min-height: 22px;
  margin-top: 16px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--muted);
}

.status.success {
  color: var(--green);
}

.status.error {
  color: var(--red);
}

.password-note {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
  margin-top: 7px;
}

@media (max-width: 480px) {
  .login-card {
    padding: 24px;
  }

  h1 {
    font-size: 29px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">Social Media Automation</div>
    <a class="back" href="../index.html">
      Zur Startseite
    </a>
  </div>
</header>

<main>
  <div class="login-card">

    <h1 id="viewTitle" tabindex="-1">
      <span id="loginBrand" class="login-brand" role="img" aria-label="SMA – Anmeldung">
        <span class="hex">S</span><span class="logoeq">=</span>
        <span class="hex">M</span><span class="logoeq">=</span>
        <span class="hex">A</span>
      </span>
      <span id="viewTitleText" hidden></span>
    </h1>

    <div id="viewIntro" class="intro" hidden></div>

    <!-- LOGIN UND REGISTRIERUNG -->

    <section id="loginView">

      <form id="authForm">

        <label for="email">E-Mail-Adresse</label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="name@beispiel.at"
          required
        >

        <label for="password">Passwort</label>

        <div class="password-field">

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="••••••••••"
            required
          >

          <button
            type="button"
            class="eye-toggle"
            data-target="password"
            aria-label="Passwort anzeigen"
            aria-pressed="false"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
              <path class="slash" d="M3 3l18 18"></path>
            </svg>
          </button>

        </div>

        <div class="password-note" id="registrationPasswordHint" hidden>
          Für neue Passwörter: mindestens 10 Zeichen
          mit Groß- und Kleinbuchstaben, Zahl und Sonderzeichen.
        </div>

        <div class="link-row" id="forgotLinkRow">
          <button id="confirmationButton" class="link-button" type="button">
            Bestätigungsmail fehlt?
          </button>
          <button
            id="forgotButton"
            class="link-button"
            type="button"
          >
            Passwort vergessen?
          </button>
        </div>

        <div class="actions">

          <button id="authSubmit" type="submit" disabled>
            Anmelden
          </button>

          <a id="authModeLink" class="auth-mode-link" href="?ansicht=registrieren">
            Neues Konto erstellen
          </a>

        </div>

      </form>

    </section>

    <!-- PASSWORT VERGESSEN -->

    <section id="forgotView" hidden>

      <form id="forgotForm">

        <label for="forgotEmail">
          E-Mail-Adresse deines SMA-Kontos
        </label>

        <input
          id="forgotEmail"
          type="email"
          autocomplete="email"
          placeholder="name@beispiel.at"
          required
        >

        <div class="actions">

          <button
            id="sendResetButton"
            type="submit"
          >
            Wiederherstellungslink senden
          </button>

          <button
            id="backToLoginButton"
            class="secondary"
            type="button"
          >
            Zur Anmeldung
          </button>

        </div>

      </form>

    </section>

    <!-- NEUES PASSWORT FESTLEGEN -->

    <section id="resetView" hidden>

      <form id="resetForm">

        <label for="newPassword">
          Neues Passwort
        </label>

        <div class="password-field">

          <input
            id="newPassword"
            type="password"
            autocomplete="new-password"
            minlength="10"
            required
          >

          <button
            type="button"
            class="eye-toggle"
            data-target="newPassword"
            aria-label="Neues Passwort anzeigen"
            aria-pressed="false"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
              <path class="slash" d="M3 3l18 18"></path>
            </svg>
          </button>

        </div>

        <div class="password-note">
          Mindestens 10 Zeichen mit Groß- und
          Kleinbuchstaben, Zahl und Sonderzeichen.
        </div>

        <label for="confirmPassword">
          Neues Passwort wiederholen
        </label>

        <div class="password-field">

          <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="10"
            required
          >

          <button
            type="button"
            class="eye-toggle"
            data-target="confirmPassword"
            aria-label="Passwortbestätigung anzeigen"
            aria-pressed="false"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
              <path class="slash" d="M3 3l18 18"></path>
            </svg>
          </button>

        </div>

        <div class="actions">

          <button
            id="savePasswordButton"
            type="submit"
          >
            Neues Passwort speichern
          </button>

        </div>

      </form>

    </section>

    <div
      id="status"
      class="status"
      aria-live="polite"
    ></div>

  </div>
</main>

<script type="module">

import {
  createClient
} from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL =
  'https://bnvnmdxosbnuzedokqgh.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
  'sb_publishable_WbdlBQv6f_p5G8SZ_CMEAw_tMxHHklW';

const APP_URL =
  'https://sma-automation.com/app/';

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const form = document.getElementById('authForm');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const forgotEmail = document.getElementById('forgotEmail');

const authSubmit = document.getElementById('authSubmit');
const authModeLink = document.getElementById('authModeLink');
const sendResetButton = document.getElementById('sendResetButton');
const savePasswordButton = document.getElementById('savePasswordButton');

const status = document.getElementById('status');

const urlHash = new URLSearchParams(
  window.location.hash.slice(1)
);

const urlQuery = new URLSearchParams(
  window.location.search
);

let recoveryMode =
  urlHash.get('type') === 'recovery' ||
  urlQuery.get('type') === 'recovery';

const expiredLink = [urlHash, urlQuery].some(params => params.get('error_code') === 'otp_expired');
let passwordChangeConfirmed = false;
let recoveryEventsAllowed = !expiredLink;
let initialSessionRead = null;

// A session read may wait on auth initialization or a refresh indefinitely.
// Bound the UI's wait and consume late answers without cancelling auth itself.
function readSessionWithinDeadline() {
  let finish;
  const result = new Promise(resolve => {
    let pending = true;
    let timer;
    finish = value => {
      if (!pending) return;
      pending = false;
      clearTimeout(timer);
      resolve(value);
    };
    timer = setTimeout(() => finish({
      error: new Error('Die Sitzungsprüfung dauert zu lange.'), timedOut: true
    }), 15000);
    Promise.resolve().then(() => supabase.auth.getSession())
      .then(finish, error => finish({error}));
  });
  return {result, cancel: () => finish({cancelled: true})};
}

function dismissInitialSession() {
  recoveryEventsAllowed = false;
  if (!initialSessionRead) return;
  initialSessionRead.cancel();
  initialSessionRead = null;
  authSubmit.disabled = false;
}

// STATUSANZEIGE

function setStatus(message, type = '') {
  status.textContent = message || '';
  status.className = 'status' + (type ? ' ' + type : '');
}

// BUTTONS SPERREN

function setBusy(busy) {
  authSubmit.disabled = busy;
  sendResetButton.disabled = busy;
  savePasswordButton.disabled = busy;
  for (const id of ['forgotButton', 'confirmationButton', 'backToLoginButton', 'forgotEmail']) {
    document.getElementById(id).disabled = busy;
  }
}

// ANSICHT WECHSELN

let currentView;

function showView(view) {
  currentView = view;

  document.getElementById('loginView').hidden =
    view !== 'login' && view !== 'register';

  document.getElementById('forgotView').hidden =
    view !== 'forgot' && view !== 'confirm';

  sendResetButton.textContent = view === 'confirm'
    ? 'Bestätigungsmail erneut anfordern'
    : 'Wiederherstellungslink senden';

  document.getElementById('resetView').hidden =
    view !== 'reset';

  if (view === 'login' || view === 'register') {
    const registering = view === 'register';
    const pilot = urlQuery.get('kundenmedien') === 'pilot';
    const next = new URLSearchParams();
    if (!registering) next.set('ansicht', 'registrieren');
    if (pilot) next.set('kundenmedien', 'pilot');
    authModeLink.href = 'index.html' + (next.size ? '?' + next : '');
    authModeLink.textContent = registering ? 'Mit bestehendem Konto anmelden' : 'Neues Konto erstellen';
    authSubmit.textContent = registering ? 'Konto erstellen' : 'Anmelden';
    passwordInput.setAttribute('autocomplete', registering ? 'new-password' : 'current-password');
    document.getElementById('registrationPasswordHint').hidden = !registering;
    if (registering) passwordInput.setAttribute('aria-describedby', 'registrationPasswordHint');
    else passwordInput.removeAttribute('aria-describedby');
    document.getElementById('forgotLinkRow').hidden = registering;
  }

  const titles = {
    register: [
      'SMA-Konto erstellen',
      'Registriere dich mit deiner E-Mail-Adresse und einem neuen Passwort.'
    ],
    confirm: [
      'E-Mail-Adresse bestätigen',
      'Hier kannst du einen neuen Bestätigungslink für deine Registrierung anfordern.'
    ],
    forgot: [
      'Passwort vergessen?',
      'Wir senden dir einen Link zum Festlegen eines neuen Passworts.'
    ],
    reset: [
      'Neues Passwort',
      'Lege jetzt dein neues Passwort für dein SMA-Konto fest.'
    ]
  };

  const login = view === 'login';
  const title = document.getElementById('viewTitleText');
  const intro = document.getElementById('viewIntro');
  document.getElementById('loginBrand').hidden = !login;
  title.hidden = login;
  intro.hidden = login;
  if (!login) {
    [title.textContent, intro.textContent] = titles[view];
  }

  setStatus('');
}

// PASSWORTSICHERHEIT

function strongPassword(value) {

  return (
    value.length >= 10 &&
    /[a-z]/.test(value) &&
    /[A-Z]/.test(value) &&
    /[0-9]/.test(value) &&
    /[^a-zA-Z0-9]/.test(value)
  );

}

// AUGENSYMBOL

document.querySelectorAll('.eye-toggle').forEach(
  (button) => {

    button.addEventListener('click', () => {

      const input = document.getElementById(
        button.dataset.target
      );

      const isVisible =
        input.type === 'password';

      input.type =
        isVisible ? 'text' : 'password';

      button.classList.toggle(
        'is-visible',
        isVisible
      );

      button.setAttribute(
        'aria-pressed',
        String(isVisible)
      );

      button.setAttribute(
        'aria-label',
        isVisible
          ? 'Passwort verbergen'
          : 'Passwort anzeigen'
      );

    });

  }
);

// SUPABASE PASSWORT-WIEDERHERSTELLUNG

supabase.auth.onAuthStateChange((event) => {

  if (event === 'SIGNED_OUT') dismissInitialSession();

  if (event === 'PASSWORD_RECOVERY' && recoveryEventsAllowed && !passwordChangeConfirmed) {

    recoveryMode = true;

    showView('reset');

    setStatus(
      'Wiederherstellungslink bestätigt. Bitte neues Passwort eingeben.'
    );

  }

});

if (expiredLink) {
  const signup = [urlHash, urlQuery].some(params => params.get('type') === 'signup');
  showView(recoveryMode ? 'forgot' : signup ? 'confirm' : 'login');
  recoveryMode = false;
  setStatus(currentView === 'login'
    ? 'Dieser Link ist abgelaufen. Wähle „Bestätigungsmail fehlt?“ für die Registrierung oder „Passwort vergessen?“ für ein neues Passwort.'
    : 'Dieser Link ist abgelaufen. Du kannst einen neuen Link anfordern.', 'error');
} else if (recoveryMode) {

  showView('reset');

  setStatus('Bitte gib dein neues Passwort ein.');

} else {
  showView(urlQuery.get('ansicht') === 'registrieren' ? 'register' : 'login');
}

// BESTEHENDE SESSION PRÜFEN

function openDashboard() {
  const order = urlQuery.get('buchung');
  if (/^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/.test(order)) {
    window.location.replace('paketwahl.html?buchung=' + order);
    return;
  }
  const pilot = urlQuery.get('kundenmedien') === 'pilot';
  window.location.replace(pilot ? 'dashboard.html?kundenmedien=pilot' : 'dashboard.html');
}

async function checkExistingSession() {
  const read = readSessionWithinDeadline();
  initialSessionRead = read;
  const result = await read.result;
  // A help choice, password submission or sign-out owns the page from then on.
  if (initialSessionRead !== read || result.cancelled) return;
  initialSessionRead = null;
  authSubmit.disabled = false;

  const {data: sessionData, error: sessionError, timedOut} = result;
  if (timedOut) {
    recoveryEventsAllowed = false;
    if (!expiredLink) setStatus(recoveryMode
      ? 'Der Wiederherstellungslink konnte noch nicht geprüft werden. Bitte versuche das Speichern erneut.'
      : 'Deine Anmeldung konnte noch nicht geprüft werden. Du kannst dich anmelden oder die Passwort-Hilfe nutzen.', 'error');
  } else if (sessionError && recoveryMode) {
    if (recoverySessionExpired(sessionError)) {
      requestNewRecoveryLink();
    } else {
      setStatus('Der Wiederherstellungslink konnte gerade nicht geprüft werden. Bitte versuche es erneut.', 'error');
    }
  } else if (!sessionError && !sessionData?.session && recoveryMode) {
    requestNewRecoveryLink();
  } else if (sessionError && !expiredLink) {
    setStatus('SMA ist gerade nicht erreichbar. Bitte versuche es erneut.', 'error');
  }

  if (!sessionError && sessionData?.session && !recoveryMode && !expiredLink) {
    openDashboard();
  }
}

// ANMELDUNG UND REGISTRIERUNG

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  if (authSubmit.disabled || recoveryMode || !['login', 'register'].includes(currentView)) return;
  dismissInitialSession();

  const registering = currentView === 'register';
  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (registering && !strongPassword(password)) {
    setStatus(
      'Bitte verwende mindestens 10 Zeichen, Groß- und Kleinbuchstaben, eine Zahl und ein Sonderzeichen.',
      'error'
    );
    return;
  }

  setBusy(true);
  setStatus(registering ? 'Registrierung wird erstellt …' : 'Anmeldung wird geprüft …');
  try {
    const credentials = { email, password };
    const { data, error } = registering
      ? await supabase.auth.signUp({ ...credentials, options: { emailRedirectTo: APP_URL } })
      : await supabase.auth.signInWithPassword(credentials);
    if (error) {
      if (!registering && error.code === 'email_not_confirmed') {
        openLinkForm('confirm', email);
        setStatus('Bitte bestätige zuerst deine E-Mail-Adresse.');
        return;
      }
      setStatus(error.message, 'error');
      return;
    }
    if (registering && !data?.session) {
      openLinkForm('confirm', email);
      setStatus('Bitte prüfe dein Postfach für die Bestätigung deiner E-Mail-Adresse.', 'success');
      return;
    }

    openDashboard();
  } catch {
    setStatus('SMA ist gerade nicht erreichbar. Bitte versuche es erneut.', 'error');
  } finally {
    setBusy(false);
  }
});

function openLinkForm(view, email) {
  dismissInitialSession();
  showView(view);
  forgotEmail.value = email;
  passwordInput.value = '';
  document.getElementById('viewTitle').focus();
}

document.getElementById('forgotButton').addEventListener('click', () => openLinkForm('forgot', emailInput.value.trim()));
document.getElementById('confirmationButton').addEventListener('click', () => openLinkForm('confirm', emailInput.value.trim()));

// ZURÜCK ZUM LOGIN

document.getElementById('backToLoginButton')
  .addEventListener('click', () => {

    dismissInitialSession();
    showView('login');
    emailInput.value = forgotEmail.value.trim();
    emailInput.focus();

  });

// BESTÄTIGUNG ODER WIEDERHERSTELLUNG

document.getElementById('forgotForm')
  .addEventListener('submit', async (event) => {
    event.preventDefault();
    if (sendResetButton.disabled || !['confirm', 'forgot'].includes(currentView)) return;
    dismissInitialSession();
    const view = currentView;
    const confirm = view === 'confirm';
    const email = forgotEmail.value.trim();
    setBusy(true);
    setStatus('Link wird angefordert …');
    try {
      const { error } = confirm
        ? await supabase.auth.resend({type: 'signup', email, options: {emailRedirectTo: APP_URL}})
        : await supabase.auth.resetPasswordForEmail(email, {redirectTo: APP_URL});
      if (currentView !== view) return;
      if (error?.status === 429 || error?.code === 'over_email_send_rate_limit') {
        setStatus('Es wurden bereits mehrere Links angefordert. Bitte warte einen Moment und versuche es erneut.', 'error');
        return;
      }
      if (error && !(confirm && ['user_not_found', 'email_exists', 'user_already_exists'].includes(error.code))) {
        throw error;
      }
      setStatus(
        confirm
          ? 'Falls die Bestätigung für diese Adresse noch aussteht, erhältst du eine E-Mail. Prüfe auch den Spam-Ordner.'
          : 'Falls für diese E-Mail-Adresse ein SMA-Konto existiert, erhältst du einen Link zum Zurücksetzen des Passworts. Bitte prüfe auch den Spam-Ordner.',
        'success');
    } catch {
      if (currentView === view) setStatus('Der Link konnte gerade nicht angefordert werden. Bitte versuche es erneut.', 'error');
    } finally {
      setBusy(false);
    }
  });

// NEUES PASSWORT SPEICHERN

function recoverySessionExpired(error) {
  return error?.name === 'AuthSessionMissingError' || [
    'session_expired', 'session_not_found',
    'refresh_token_not_found', 'refresh_token_already_used'
  ].includes(error?.code);
}

function clearRecoveryPasswords(disabled = false) {
  for (const id of ['newPassword', 'confirmPassword']) {
    const input = document.getElementById(id);
    input.value = '';
    input.disabled = disabled;
  }
  passwordInput.value = '';
}

function clearRecoveryUrl() {
  window.history.replaceState(null, '', new URL('./', window.location.href).pathname);
}

function requestNewRecoveryLink() {
  recoveryMode = false;
  clearRecoveryPasswords();
  clearRecoveryUrl();
  openLinkForm('forgot', emailInput.value.trim());
  setStatus('Der Wiederherstellungslink ist ungültig oder abgelaufen. Du kannst hier einen neuen Link anfordern.', 'error');
}

document.getElementById('resetForm')
  .addEventListener('submit', async (event) => {

    event.preventDefault();
    if (savePasswordButton.disabled || !recoveryMode || currentView !== 'reset') return;
    dismissInitialSession();

    const newPassword =
      document.getElementById('newPassword').value;

    const confirmPassword =
      document.getElementById('confirmPassword').value;

    if (!passwordChangeConfirmed && !strongPassword(newPassword)) {

      setStatus(
        'Bitte verwende mindestens 10 Zeichen, Groß- und Kleinbuchstaben, eine Zahl und ein Sonderzeichen.',
        'error'
      );

      return;

    }

    if (!passwordChangeConfirmed && newPassword !== confirmPassword) {

      setStatus(
        'Die beiden Passwörter stimmen nicht überein.',
        'error'
      );

      return;

    }

    setBusy(true);

    try {
      if (!passwordChangeConfirmed) {
        setStatus('Neues Passwort wird gespeichert ...');

        const { data: currentSession, error: sessionCheckError } = await readSessionWithinDeadline().result;
        if (sessionCheckError) throw sessionCheckError;
        if (!currentSession?.session) {
          requestNewRecoveryLink();
          return;
        }

        const { error } = await supabase.auth.updateUser({ password: newPassword });
        if (error) {
          if (error.code === 'same_password') {
            setStatus('Bitte verwende ein anderes Passwort als das bisherige.', 'error');
          } else if (error.code === 'weak_password') {
            setStatus('Das Passwort erfüllt die Sicherheitsanforderungen nicht. Bitte wähle ein anderes.', 'error');
          } else throw error;
          return;
        }

        // A confirmed password change must not be submitted again if sign-out fails.
        passwordChangeConfirmed = true;
        clearRecoveryPasswords(true);
        savePasswordButton.textContent = 'Abmeldung erneut versuchen';
      }

      setStatus('Dein Passwort wurde geändert. Die Abmeldung wird abgeschlossen …');
      const { error: signOutError } = await supabase.auth.signOut();
      if (signOutError) throw signOutError;

      recoveryMode = false;
      clearRecoveryUrl();
      showView('login');
      document.getElementById('viewTitle').focus();
      setStatus('Dein Passwort wurde geändert. Bitte melde dich mit dem neuen Passwort an.', 'success');
    } catch (error) {
      if (passwordChangeConfirmed) {
        setStatus('Dein Passwort wurde geändert. Die Abmeldung konnte noch nicht bestätigt werden. Bitte versuche die Abmeldung erneut.', 'error');
      } else if (recoverySessionExpired(error)) {
        requestNewRecoveryLink();
      } else {
        setStatus('Die Passwortänderung konnte gerade nicht bestätigt werden. Bitte versuche es erneut.', 'error');
      }
    } finally {
      setBusy(false);
    }

  });

// Wire every customer control before starting the optional automatic redirect.
// Do not make module initialization wait for the authentication service.
void checkExistingSession();

</script>
