<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>SMA · Kundenbereich</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#151b27}#state{max-width:560px;margin:15vh auto;padding:32px;background:white;border:1px solid #dfe3eb;border-radius:20px;text-align:center}.brand{display:flex;justify-content:center;align-items:center;gap:9px;font-weight:800;font-size:24px;margin-bottom:24px;color:#4065d8}.brand span{background:#f0f3ff;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);padding:13px 22px}button,a{font:inherit}button{border:1px solid #dfe3eb;padding:11px 18px;border-radius:10px;background:white;cursor:pointer;margin:8px}#retry{background:#4065d8;color:white}#dashboard{border:0;display:block;width:100%;height:100dvh}[hidden]{display:none!important}p{line-height:1.6}
</style></head>
<body><section id="state" role="status"><div class="brand" aria-label="SMA"><span>S</span>=<span>M</span>=<span>A</span></div><h1 id="heading">Dein SMA-Dashboard wird geladen</h1><p id="message">Die Anmeldung wird geprüft …</p><button id="retry" hidden>Erneut laden</button><button id="logout" hidden>Abmelden</button></section>
<iframe id="dashboard" title="SMA Kunden-Dashboard" hidden></iframe>

<script type="module">
import {createMediaThumbnailLoader} from './assets/asset-thumbnail.mjs?v=1';
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://bnvnmdxosbnuzedokqgh.supabase.co','sb_publishable_WbdlBQv6f_p5G8SZ_CMEAw_tMxHHklW');
const endpoint='https://johnmusic.app.n8n.cloud/webhook/sma-dashboard-session';
const frame=document.getElementById('dashboard');
const state=document.getElementById('state');
const portalNames={youtube:'YouTube',instagram:'Instagram',facebook:'Facebook',tiktok:'TikTok'};
let optimizerFrames=null,optimizerPage=null,optimizerHeading=null,optimizerHeader=null,publishingPage=null;
let optimizerTrigger=null,selectedFileId=null;
let fileView=null;
function showPublishing(){
 if(!publishingPage)return;optimizerPage.hidden=true;publishingPage.classList.remove('sma-optimizing');
 for(const child of publishingPage.children)child.classList.remove('sma-publishing-hidden');
 optimizerTrigger?.focus();
}
function closeOptimizer(){if(history.state?.smaOptimization)history.back();else showPublishing();}
function openOptimizer(portal,trigger,restoring=false){
 if(!optimizerPage)return;optimizerTrigger=trigger;optimizerHeading.textContent=portalNames[portal]+' optimieren';
 const frameKey=portal+':'+(selectedFileId||'template');
 let preview=[...(optimizerFrames?.children||[])].find(el=>el.dataset.key===frameKey);
 if(!preview){
  preview=publishingPage.ownerDocument.createElement('iframe');preview.dataset.portal=portal;preview.dataset.key=frameKey;preview.title=portalNames[portal]+' – Medien und Beitrag optimieren';
  const url=new URL('publication-preview.html',window.location.href);url.searchParams.set('embedded','1');url.searchParams.set('wide','1');url.searchParams.set('portal',portal);url.searchParams.set('v','27');if(selectedFileId)url.searchParams.set('asset',selectedFileId);preview.src=url.href;optimizerFrames.append(preview);
 }
 for(const el of optimizerFrames.children)el.hidden=el!==preview;
 for(const child of publishingPage.children)if(child!==optimizerPage)child.classList.add('sma-publishing-hidden');
 publishingPage.classList.add('sma-optimizing');optimizerPage.hidden=false;optimizerPage.scrollIntoView({block:'start'});optimizerHeading.focus();
 optimizerHeader.hidden=preview.dataset.view==='preview';
 if(restoring){const view=history.state?.view==='preview'?'preview':'files';preview.dataset.view=view;optimizerHeader.hidden=view==='preview';preview.contentWindow?.postMessage({type:'sma-publication-show-view',view},window.location.origin);}
 if(!restoring){const route={smaOptimization:true,portal,assetId:selectedFileId};if(!history.state?.smaOptimization)history.pushState(route,'', '#optimieren/'+portal);else history.replaceState(route,'', '#optimieren/'+portal);}
}
function clearOptimizer(){optimizerFrames?.replaceChildren();showPublishing();optimizerTrigger=null;selectedFileId=null;if(history.state?.smaOptimization)history.replaceState(null,'',location.pathname+location.search);}
function optimizerWorkspaceView(preview,view){
 if(preview.hidden||optimizerPage.hidden||!['files','source','preview'].includes(view))return;
 const before=preview.dataset.view;preview.dataset.view=view;optimizerHeader.hidden=view==='preview';
 if(view==='preview'&&history.state?.smaOptimization&&history.state.view!=='preview')history.pushState({...history.state,view:'preview'},'', '#optimieren/'+preview.dataset.portal+'/vorschau');
 else if(view!=='preview'&&history.state?.view==='preview')history.back();
 if((view==='preview'||before==='preview')&&before!==view)optimizerPage.scrollIntoView({block:'start'});
}
window.addEventListener('popstate',event=>{const route=event.state;if(route?.smaOptimization&&Object.hasOwn(portalNames,route.portal)){selectedFileId=route.assetId||null;openOptimizer(route.portal,optimizerTrigger,true);}else showPublishing();});
function attachOptimizerPage(doc,page){
 publishingPage=page;optimizerPage=doc.createElement('section');optimizerPage.id='smaOptimizationPage';optimizerPage.hidden=true;
 const header=doc.createElement('header');optimizerHeader=header;header.className='sma-optimization-header';const back=doc.createElement('button');back.type='button';back.className='sma-optimization-back';back.setAttribute('aria-label','Zurück zur Veröffentlichung');back.title='Zurück zur Veröffentlichung';const arrow=doc.createElement('span');arrow.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>';arrow.setAttribute('aria-hidden','true');const backLabel=doc.createElement('span');backLabel.textContent='Veröffentlichung';back.append(arrow,backLabel);back.addEventListener('click',closeOptimizer);
 optimizerHeading=doc.createElement('h1');optimizerHeading.tabIndex=-1;header.append(back,optimizerHeading);optimizerFrames=doc.createElement('div');optimizerFrames.id='smaOptimizerFrames';optimizerPage.append(header,optimizerFrames);page.append(optimizerPage);
 const style=doc.createElement('style');style.textContent=`.sma-publishing-hidden{display:none!important}.sma-optimizing{background:#fff!important}body:has(#page-publishing.active.sma-optimizing) .topbar-title{visibility:hidden}#smaOptimizationPage{border:0;background:transparent;padding:0;margin:0;width:100%;min-width:0}#smaOptimizationPage[hidden],#smaOptimizerFrames iframe[hidden]{display:none!important}.sma-optimization-header{margin-bottom:18px}.sma-optimization-header .sma-optimization-back{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:auto;min-height:48px;border:0;border-radius:9px;background:#4065d8;padding:12px 17px;color:#fff;cursor:pointer;margin-bottom:6px;font:500 14px/1.5 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;white-space:nowrap}.sma-optimization-back span{display:flex}.sma-optimization-back svg{width:24px;height:24px}.sma-optimization-header .sma-optimization-back:hover{background:#3157cd}.sma-optimization-header .sma-optimization-back:focus-visible{outline:3px solid #a5b8fa;outline-offset:3px}.sma-optimization-header h1{font-size:28px;margin:12px 0 0;line-height:1.25;outline:none}#smaOptimizerFrames{width:100%;min-width:0}#smaOptimizerFrames iframe{display:block;border:0;width:100%;height:1100px;min-height:400px}@media(max-width:650px){.sma-optimization-header h1{font-size:23px}}`;doc.head.append(style);
}
// Extend the existing portal cards; no extra shared publishing card.
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  const page=doc?.getElementById('page-publishing');
  if(!page)return;
  const style=doc.createElement('style');style.textContent=`
    #page-publishing .platform-card{grid-template-columns:48px minmax(0,1fr) auto}
    #page-publishing .sma-optimize{grid-column:3;grid-row:1;border:1px solid #c7d3f8;background:#edf2ff;color:#3157cd;border-radius:10px;padding:10px 16px;font:700 14px Arial,sans-serif;cursor:pointer;white-space:nowrap}
    #page-publishing .sma-optimize:focus-visible{outline:3px solid #9bb3fc;outline-offset:3px}
    @media(max-width:520px){#page-publishing .platform-card{grid-template-columns:40px minmax(0,1fr)}#page-publishing .sma-optimize{grid-column:2;grid-row:2;justify-self:start;padding:9px 14px}}
  `;doc.head.append(style);
  fileView?.clear();fileView=attachFileList(doc,page);attachOptimizerPage(doc,page);
  for(const card of page.querySelectorAll('.platform-card')){
    const portal=Object.keys(portalNames).find(key=>portalNames[key]===card.querySelector('.platform-info strong')?.textContent.trim());
    if(!portal||card.querySelector('.sma-optimize'))continue;
    const button=doc.createElement('button');button.type='button';button.className='sma-optimize';button.textContent='Optimieren';button.dataset.portal=portal;button.setAttribute('aria-controls','smaOptimizationPage');
    button.addEventListener('click',event=>{event.stopPropagation();openOptimizer(portal,button);});card.append(button);
  }
});
function attachFileList(doc,page){
 const slot=doc.getElementById('publishingFilesSlot');if(!slot)return null;
 const style=doc.createElement('style');style.textContent=`#publishingFilesSlot{display:block;min-height:0;padding:16px;text-align:left}.sma-file-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.sma-file-toolbar button,.sma-file-row button,.sma-file-pages button{border:1px solid #c7d3f8;border-radius:9px;background:#edf2ff;color:#3157cd;padding:9px 13px;font:700 14px Arial,sans-serif;cursor:pointer}.sma-file-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid #e2e6ee}.sma-file-row>div{min-width:0}.sma-file-row strong{display:block;overflow-wrap:anywhere}.sma-file-row small{display:block;color:#65718a;margin-top:6px;line-height:1.5}.sma-file-row button[aria-pressed=true]{background:#4065d8;color:white}.sma-file-pages{display:flex;align-items:center;gap:12px;margin-top:12px}.sma-file-pages button:disabled{opacity:.45;cursor:default}`;doc.head.append(style);
 const galleryStyle=doc.createElement('style');galleryStyle.textContent=`.sma-file-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.sma-file-grid .sma-file-row{min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:8px;border:0;padding:0}.sma-file-grid .sma-gallery-select{width:100%;padding:0;margin:0;overflow:hidden;border:2px solid transparent;border-radius:12px;text-align:left;background:#eef1f8}.sma-file-grid .sma-gallery-select[aria-pressed=true]{border-color:#4065d8;background:#eef1f8;color:#3157cd;box-shadow:0 0 0 2px #dbe3ff}.sma-gallery-visual{display:grid;place-items:center;width:100%;aspect-ratio:3/4;overflow:hidden;background:#e7ebf3;color:#65718a;font-size:32px}.sma-gallery-visual img{display:block;width:100%;height:100%;object-fit:cover}.sma-gallery-label{display:block;padding:10px;font-size:13px;overflow-wrap:anywhere}.sma-file-row details{font-size:12px;min-width:0;overflow-wrap:anywhere}.sma-file-row summary{cursor:pointer;color:#65718a}.sma-file-row details strong{font-size:12px;font-weight:400;margin-top:8px}@media(max-width:1050px){.sma-file-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){.sma-file-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}`;doc.head.append(galleryStyle);
 const thumbnails=createMediaThumbnailLoader(async()=>{const {data,error}=await supabase.auth.getSession();if(signedOut||error||!data?.session)throw Error('AUTH_REQUIRED');return data.session.access_token;});
 const toolbar=doc.createElement('div');toolbar.className='sma-file-toolbar';const refresh=doc.createElement('button');refresh.textContent='Dateien aktualisieren';refresh.type='button';const message=doc.createElement('span');message.setAttribute('role','status');message.style.fontSize='13px';toolbar.append(refresh,message);
 const selection=doc.createElement('p');selection.style.fontSize='13px';const list=doc.createElement('div');list.className='sma-file-grid';const pages=doc.createElement('div');pages.className='sma-file-pages';slot.replaceChildren(toolbar,selection,list,pages);
 let files=[],pageNumber=0,loading=false,lastSync=0;
 const say=text=>message.textContent=text;
 function draw(){thumbnails.reset();list.replaceChildren();pages.replaceChildren();selection.textContent=selectedFileId?'Datei ausgewählt. Öffne oben „Optimieren“ beim gewünschten Portal.':'Wähle eine Datei und anschließend oben das gewünschte Portal über „Optimieren“.';
  if(!files.length){selection.textContent='Noch keine Bild- oder Videodateien im zugeordneten Kundenordner.';return;}
  pageNumber=Math.min(pageNumber,Math.max(0,Math.ceil(files.length/10)-1));
  for(const f of files.slice(pageNumber*10,pageNumber*10+10)){const row=doc.createElement('div');row.className='sma-file-row';const info=doc.createElement('details');const detailsLabel=doc.createElement('summary');detailsLabel.textContent='Dateidetails';info.append(detailsLabel);const name=doc.createElement('strong');name.textContent=f.name;const meta=doc.createElement('small');meta.textContent=(f.media_kind==='video'?'Video':'Bild')+' · '+new Date(f.modified_at).toLocaleDateString('de-AT');const assigned=doc.createElement('small');assigned.textContent=(f.assignments||[]).map(a=>(portalNames[a.platform]||a.platform)+(a.status==='assigned'?' ✓':' · neu prüfen')).join(' · ')||'Noch kein Portaltext zugeordnet';info.append(name,meta,assigned);const choose=doc.createElement('button');choose.type='button';choose.textContent=selectedFileId===f.id?'Ausgewählt':'Auswählen';choose.setAttribute('aria-pressed',String(selectedFileId===f.id));const visual=doc.createElement('span');visual.className='sma-gallery-visual';const label=doc.createElement('span');label.className='sma-gallery-label';label.textContent=(f.media_kind==='video'?'▶ Video':'Bild')+(selectedFileId===f.id?' · Ausgewählt':'');choose.textContent='';choose.className='sma-gallery-select';choose.setAttribute('aria-label','Datei auswählen: '+f.name);choose.append(visual,label);choose.addEventListener('click',()=>{selectedFileId=selectedFileId===f.id?null:f.id;draw();});row.append(choose,info);list.append(row);thumbnails.observe(visual,f);}
  if(files.length>10){const back=doc.createElement('button');back.textContent='Zurück';back.disabled=pageNumber===0;back.addEventListener('click',()=>{pageNumber--;draw();});const next=doc.createElement('button');next.textContent='Weiter';next.disabled=(pageNumber+1)*10>=files.length;next.addEventListener('click',()=>{pageNumber++;draw();});const count=doc.createElement('span');count.textContent='Seite '+(pageNumber+1)+' von '+Math.ceil(files.length/10);pages.append(back,count,next);}
 }
 async function load(sync=false){if(loading)return;loading=true;refresh.disabled=true;try{
  if(sync){say('Kundenordner wird geprüft …');const {data,error}=await supabase.auth.getSession();if(error||!data?.session)throw Error('Bitte melde dich erneut an.');const res=await fetch('https://johnmusic.app.n8n.cloud/webhook/sma-publication-files-v1',{method:'POST',headers:{Authorization:'Bearer '+data.session.access_token},credentials:'omit',cache:'no-store',signal:AbortSignal.timeout(90000)});const body=await res.json();if(!res.ok||!body.ok){if(!['FILE_SYNC_RATE_LIMITED','FILE_SYNC_RUNNING'].includes(body.code))throw Error(body.code==='FOLDER_UNAVAILABLE'?'Dein Kundenordner ist nicht erreichbar oder nicht eindeutig zugeordnet. Die Ordnerverbindung muss geprüft werden.':'Die Dateien konnten noch nicht aktualisiert werden. Bitte erneut versuchen.');}else lastSync=Date.now();}
  const {data,error}=await supabase.rpc('sma_publication_files_v1',{p_action:'list'});if(error||!data?.ok)throw Error('Die Dateiliste konnte nicht geladen werden.');files=data.files||[];if(selectedFileId&&!files.some(f=>f.id===selectedFileId))selectedFileId=null;draw();say(data.synced_at?'Stand: '+new Date(data.synced_at).toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'}):'Bitte Dateien aktualisieren.');
 }catch(e){say(e.message);}finally{loading=false;refresh.disabled=false;}}
 refresh.addEventListener('click',()=>load(true));
 for(const button of doc.querySelectorAll('button'))if(button.textContent.replace(/\s+/g,'').endsWith('Veröffentlichung'))button.addEventListener('click',()=>load(Date.now()-lastSync>60000));
 load(false);return {load,clear:()=>thumbnails.clear()};
}
let pending;
let signedOut=false;
async function dashboardHtml(){
  const {data,error}=await supabase.auth.getSession();
  if(error||!data?.session){window.location.replace('index.html');throw new Error('Bitte melde dich bei SMA an.');}
  const response=await fetch(endpoint,{method:'POST',headers:{Authorization:'Bearer '+data.session.access_token},cache:'no-store',credentials:'omit',signal:AbortSignal.timeout(45000)});
  if(!response.ok)throw new Error(response.status===403?'Dein SMA-Zugang konnte noch nicht zugeordnet werden.':'Das Dashboard ist gerade nicht erreichbar. Bitte versuche es erneut.');
  const result=await response.json();
  if(typeof result.html!=='string'||!result.html.includes('data-sma-customer-id'))throw new Error('Das Dashboard konnte nicht vollständig geladen werden.');
  return result.html;
}
// Called only by the same-origin dashboard frame after OAuth returns.
window.smaDashboardResponse=async()=>new Response(await dashboardHtml(),{headers:{'Content-Type':'text/html'}});
async function load(){
  if(pending)return pending;
  pending=(async()=>{
    document.getElementById('retry').hidden=true;
    try{const html=await dashboardHtml();if(signedOut)return;clearOptimizer();frame.srcdoc=html;frame.hidden=false;state.hidden=true;}
    catch(error){frame.hidden=true;frame.removeAttribute('srcdoc');state.hidden=false;document.getElementById('heading').textContent='SMA-Dashboard';document.getElementById('message').textContent=error.message;document.getElementById('retry').hidden=false;document.getElementById('logout').hidden=false;}
  })().finally(()=>pending=null);
  return pending;
}
async function logout(){signedOut=true;fileView?.clear();clearOptimizer();frame.hidden=true;frame.removeAttribute('srcdoc');await supabase.auth.signOut();window.location.replace('index.html');}
document.getElementById('retry').addEventListener('click',load);
document.getElementById('logout').addEventListener('click',logout);
window.addEventListener('message',event=>{
  if(event.origin===window.location.origin&&event.data?.type==='sma-publication-order-open'){const preview=[...(optimizerFrames?.children||[])].find(el=>event.source===el.contentWindow);if(preview&&!preview.hidden&&!optimizerPage.hidden){optimizerPage.scrollIntoView({block:'start'});preview.contentWindow.postMessage({type:'sma-publication-order-viewport',height:Math.max(240,Math.min(720,window.innerHeight-140))},window.location.origin);}return;}
  if(event.origin===window.location.origin&&event.data?.type==='sma-publication-workspace-view'){const preview=[...(optimizerFrames?.children||[])].find(el=>event.source===el.contentWindow);if(preview)optimizerWorkspaceView(preview,event.data.view);return;}
  if(event.origin===window.location.origin&&event.data?.type==='sma-publication-preview-height'){const preview=[...(optimizerFrames?.children||[])].find(el=>event.source===el.contentWindow);const height=event.data.height;if(preview&&Number.isFinite(height)&&height>=300&&height<=30000)preview.style.height=Math.ceil(height)+'px';return;}
  if(event.origin===window.location.origin&&event.data?.type==='sma-publication-file-updated'&&[...(optimizerFrames?.children||[])].some(el=>event.source===el.contentWindow)){fileView?.load(false);return;}
  if(event.origin===window.location.origin&&event.data?.type==='sma-publication-preview-close'&&[...(optimizerFrames?.children||[])].some(el=>event.source===el.contentWindow)){
    closeOptimizer();return;
  }
  if(event.origin!==window.location.origin||event.source!==frame.contentWindow)return;
  if(event.data?.type==='sma-dashboard-reload')load();
  if(event.data?.type==='sma-dashboard-logout')logout();
});
supabase.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT'){signedOut=true;fileView?.clear();clearOptimizer();frame.removeAttribute('srcdoc');window.location.replace('index.html');}});
await load();
</script></body></html>
