<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Manuell posten · SMA</title>
<style>*{box-sizing:border-box}body{margin:auto;max-width:48rem;padding:1.5rem;font:1rem/1.5 Inter,Arial,sans-serif;color:#15213b;background:#f7f8fb}header,section{margin:1rem 0}section{background:white;border:1px solid #d7dfed;border-radius:12px;padding:1.25rem}button,select,input,.action{font:inherit;padding:.5rem .75rem;border-radius:6px;border:1px solid #a9b6cc}button{cursor:pointer;background:white}button:disabled{cursor:default;opacity:.6}select{width:100%}#send{background:#3157cd;color:white;font-weight:bold}a{color:#254cb6}h1{line-height:1.2}p{white-space:pre-line}label{display:block;margin:.75rem 0 .25rem}summary{cursor:pointer}#status{font-weight:600}[hidden]{display:none!important}</style></head>
<body><header><a href="./dashboard.html#publishing">← Veröffentlichung</a><h1 id="title">Manuell posten</h1></header>
<section><a id="drive" target="_blank" rel="noopener noreferrer" hidden>Ordner in Google Drive öffnen ↗</a>

<p><button id="reload" type="button">Ordner aktualisieren</button></p><small id="folderStatus" role="status"></small></section>
<section id="post" hidden><h2 id="headline"></h2><p id="caption"></p><p id="account"></p>
<a id="review">Beitrag ansehen und freigeben</a><p id="status" role="status" aria-live="polite"></p>
<div id="actions" hidden><button id="send" type="button">Sofort posten</button>
<details><summary>Heute zu einer anderen Uhrzeit posten</summary><label for="when">Uhrzeit in Wien</label>

<script type="module" src="./assets/manual-portal-send.mjs?v=2"></script></body></html>
