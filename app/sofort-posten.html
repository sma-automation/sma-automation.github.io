<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Manuell posten · SMA</title>
<style>
*{box-sizing:border-box}body{max-width:55rem;margin:auto;padding:1.25rem;font:1rem/1.45 Inter,Arial,sans-serif;color:#17233b;background:#f6f7fb}
header,section{margin:.85rem 0}section{background:white;border:1px solid #d7dfed;border-radius:12px;padding:1rem 1.2rem}
button,input,.action{font:inherit;padding:.5rem .8rem;border-radius:7px;border:1px solid #a9b6cc}button,summary{cursor:pointer}button{background:white;color:#192943}button:disabled{cursor:default;opacity:.5}
h1{font-size:1.85rem;margin:.45rem 0}h2{font-size:1.25rem;margin:.3rem 0}a{color:#264cb5}p{white-space:pre-line}
#drive,.primary{display:inline-block;background:#3157cd;border-color:#3157cd;color:white;font-weight:600;text-decoration:none}
#dropZone{padding:.7rem 1rem;border:1px dashed #879cbd;border-radius:7px;background:#f8faff;margin-top:.65rem}
#chooser{margin-top:.6rem}summary{color:#274bb0;width:fit-content}#videoSearch{width:100%;max-width:27rem;margin:.5rem 0}
#driveVideos{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(16rem,100%),1fr));gap:.3rem .5rem;max-height:15rem;overflow:auto}
#driveVideos button{width:100%;text-align:left;border-color:#dbe2ef}#driveVideos button[aria-pressed=true]{border-color:#3157cd;background:#ecf1ff}
#post{border-top:3px solid #3157cd}#portalLabel{display:inline-block;margin-left:.4rem;padding:.15rem .6rem;border-radius:12px;background:#edf1ff;color:#2446a9;font-weight:bold}#selectedName{overflow-wrap:anywhere;font-size:1.14rem;font-weight:650;margin:.35rem 0 .65rem}
#mediaPreview{background:#111722;max-width:100%;border-radius:7px;overflow:hidden}#mediaPreview:empty{display:none}#mediaPreview img,#mediaPreview video,#mediaPreview iframe{display:block;width:100%;height:clamp(10rem,32vh,22rem);object-fit:contain;border:0}
#mediaNotice,#folderStatus,#dropStatus{display:block;font-size:.86rem;color:#4f607a}#folderStatus:empty,#dropStatus:empty,#mediaNotice:empty,#caption:empty,#account:empty{display:none}
#actions{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}#status{font-weight:600;margin:.55rem 0}#review,#driveVideo{margin-right:1rem}#reload{margin-top:.5rem}
[hidden]{display:none!important}
</style></head><body>
<header><a href="./dashboard.html#publishing">← Veröffentlichung</a><h1 id="title">Manuell posten</h1></header>
<section><a id="drive" class="action" target="_blank" rel="noopener noreferrer" hidden>Ordner in Google Drive öffnen ↗</a>
<div id="dropZone">MP4 oder Drive-Dateilink hierher ziehen · <button type="button" id="browse">MP4 auswählen</button><input id="device" type="file" accept="video/mp4,.mp4,.m4v" hidden></div><small id="dropStatus" role="status"></small>
<details id="chooser" open><summary>Video aus dem Portalordner auswählen</summary>
<input id="videoSearch" type="search" placeholder="Videotitel suchen" aria-label="Videotitel suchen"><ul id="driveVideos"></ul><small id="noMatches" hidden>Kein passender Videotitel gefunden.</small>
<button id="reload" type="button">Ordner aktualisieren</button><small id="folderStatus" role="status"></small></details></section>
<section id="post" hidden aria-label="Ausgewählte Datei"><div><strong>Ausgewählte Datei</strong> <span id="portalLabel"></span></div><p id="selectedName"></p>
<div id="mediaPreview"></div><small id="mediaNotice" role="status"></small><a id="driveVideo" target="_blank" rel="noopener noreferrer" hidden>Video in Drive ansehen ↗</a>
<h2 id="headline" hidden></h2><p id="caption"></p><p id="account"></p><p id="status" role="status"></p>
<div id="actions"><button class="primary" id="send" type="button" disabled>Direkt posten</button>
<label>Heute um <input type="time" id="when" aria-label="Uhrzeit in Wien"> Uhr</label><button id="schedule" type="button" disabled>Automatisch posten starten</button></div>
<a id="review">Beitrag ansehen und freigeben</a></section><script type="module" src="./assets/manual-portal-send.mjs?v=6"></script></body></html>
